<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lorne To-Dos</title><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css?v=9"></head>
<body><header><h1 id="ttl">To-Dos</h1><button id="tabBtn" title="People">👥</button><button id="exBtn" title="Exercise">🏃</button><button id="mlBtn" title="Meals">🍽</button><button id="refresh" title="Refresh">⟳</button><button id="settingsBtn" title="Settings">⚙</button></header>
<div id="bar"><input id="filter" placeholder="Filter by assignee" list="assignees"><datalist id="assignees"></datalist>
<label><input type="checkbox" id="showDone"> Show completed</label></div>
<div id="notif" hidden><span id="notifMsg"></span> <button id="notifBtn">Enable reminders</button> <button class="pushBtn">Turn on push</button></div><div id="status"></div><main id="lists"></main>
<main id="people" hidden><button id="addPerson" class="add">+ Add person</button><div id="plist"></div></main>
<main id="exercise" hidden><form id="exAdd" class="exadd"><select name="activity" id="exAct"></select>
<input name="minutes" type="number" min="1" step="1" inputmode="numeric" placeholder="Min" required>
<input name="at" type="datetime-local" required><button>Add</button></form><div id="exlist"></div><details id="exTypes" class="types"><summary>Manage types</summary><div id="typeList"></div><button id="addType" class="add">+ Add type</button></details></main>
<dialog id="exedit"><form method="dialog" id="exForm"><h2>Edit entry</h2>
<label>Activity<select name="activity" id="exEAct"></select></label><label>Minutes<input name="minutes" type="number" min="1" step="1" required></label>
<label>When<input name="at" type="datetime-local" required></label>
<menu><button value="delete" formnovalidate>Delete</button><button value="cancel" formnovalidate>Cancel</button><button value="save">Save</button></menu></form></dialog>
<main id="meals" hidden><form id="mlAdd" class="exadd"><input name="description" placeholder="What did you eat?" required style="flex:1 1 100%">
<input name="at" type="datetime-local" required><button>Add</button></form><div id="mllist"></div></main>
<dialog id="mledit"><form method="dialog" id="mlForm"><h2>Edit meal</h2>
<label>Description<textarea name="description" rows="3" required></textarea></label><label>When<input name="at" type="datetime-local" required></label>
<menu><button value="delete" formnovalidate>Delete</button><button value="cancel" formnovalidate>Cancel</button><button value="save">Save</button></menu></form></dialog>
<dialog id="pedit"><form method="dialog" id="pForm"><h2 id="pTitle">Person</h2>
<label>Name<input name="name" required></label><label>Email<input name="email" type="email"></label>
<label>Cell<input name="cell" type="tel"></label>
<menu><button value="cancel" formnovalidate>Cancel</button><button value="save">Save</button></menu></form></dialog>
<dialog id="edit"><form method="dialog" id="editForm"><h2>Edit item</h2>
<label>Title<input name="title" required></label>
<label>List<input name="list" list="listNames" required></label><datalist id="listNames"></datalist>
<label>Assignee<input name="assignee" list="peopleNames"></label><datalist id="peopleNames"></datalist>
<label>Steps (one per line)<textarea name="steps" rows="5"></textarea></label>
<div class="row"><label>Due date<input name="due" type="date"></label><label>Due time<input name="dueTime" type="time"></label></div>
<label>Status<select name="status"><option>open</option><option>complete</option></select></label>
<menu><button value="cancel" formnovalidate>Cancel</button><button value="save" id="saveBtn">Save</button></menu></form></dialog>
<dialog id="settings"><form method="dialog" id="setForm"><h2>GitHub access</h2>
<p>Paste a fine-grained token with Contents read/write on <b>lorneshantz/lorne-todos</b> only. Stored only on this device.</p>
<label>Token<input name="token" type="password" autocomplete="off"></label>
<p><button type="button" class="pushBtn">Turn on push</button> <span class="pushState"></span><br><small>Push works with the app closed. iPhone: only from the Home Screen app, iOS 16.4+.</small></p>
<menu><button value="signout" formnovalidate>Sign out</button><button value="cancel" formnovalidate>Cancel</button><button value="save">Save</button></menu></form></dialog>
<script src="app.js?v=9"></script></body></html>
