name: due-push
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
concurrency: {group: due-push, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: lorneshantz/lorne-todos, ssh-key: '${{ secrets.LORNE_TODOS_DEPLOY_KEY }}', path: data}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --prefix push --no-audit --no-fund
      - run: node push/send.js
        env:
          DATA_DIR: data
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      - name: Commit state
        working-directory: data
        run: |
          git config user.name "todo-push-bot"; git config user.email "lorneshantz@users.noreply.github.com"
          git add pushed.json subscriptions.json 2>/dev/null || true
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "push: update state [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 3; done; exit 1
