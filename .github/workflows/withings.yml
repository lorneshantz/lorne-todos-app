name: withings-sync
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
concurrency: {group: withings-sync, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: chk
        env: {A: '${{ secrets.WITHINGS_CLIENT_ID }}', B: '${{ secrets.WITHINGS_CLIENT_SECRET }}'}
        run: |
          if [ -z "$A" ] || [ -z "$B" ]; then echo "::notice::WITHINGS_CLIENT_ID / WITHINGS_CLIENT_SECRET not set; skipping."; echo ok=0 >> $GITHUB_OUTPUT; else echo ok=1 >> $GITHUB_OUTPUT; fi
      - if: steps.chk.outputs.ok == '1'
        uses: actions/checkout@v4
      - if: steps.chk.outputs.ok == '1'
        uses: actions/checkout@v4
        with: {repository: lorneshantz/lorne-todos, ssh-key: '${{ secrets.LORNE_TODOS_DEPLOY_KEY }}', path: data}
      - if: steps.chk.outputs.ok == '1'
        uses: actions/setup-node@v4
        with: {node-version: 20}
      - if: steps.chk.outputs.ok == '1'
        run: node withings/sync.js
        env:
          DATA_DIR: data
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
      - if: always() && steps.chk.outputs.ok == '1'
        name: Commit
        working-directory: data
        run: |
          git config user.name "withings-sync-bot"; git config user.email "lorneshantz@users.noreply.github.com"
          git add -A weight-history.json steps-history.json withings-tokens.json withings-config.json withings-auth.json 2>/dev/null || git add -A .
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -qm "withings: sync [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 3; done; exit 1
